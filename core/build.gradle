[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "io.github.spair:imgui-java-binding:$imguiVersion"
  api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"

  api("io.github.spair:imgui-java-lwjgl3:$imguiVersion") {
    exclude group: 'org.lwjgl'
  }

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  implementation "org.lwjgl:lwjgl-tinyfd:$lwjgl3Version"
  ['natives-windows', 'natives-linux', 'natives-macos', 'natives-macos-arm64'].each {
    runtimeOnly "org.lwjgl:lwjgl-tinyfd:$lwjgl3Version:$it"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
